apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "system-services-monitor.fullname" . }}
  labels:
    {{- include "system-services-monitor.labels" . | nindent 4 }}
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 5%
  selector:
    matchLabels:
      {{- include "system-services-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "system-services-monitor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metrics
    spec:
      serviceAccountName: {{ include "system-services-monitor.fullname" . }}
      # hostPID is required so the monitor can use nsenter against the host
      # mount/PID namespace to read systemd state and run nvidia-smi.
      hostPID: true
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: monitor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default ((.Values.global).image).tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "system-services-monitor.fullname" . }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            # privileged is required for nsenter into the host mount namespace
            # to inspect host systemd services and run nvidia-smi from the host.
            privileged: true
          volumeMounts:
            - name: host-dbus
              mountPath: /var/run/dbus
              readOnly: true
      volumes:
        - name: host-dbus
          hostPath:
            path: /var/run/dbus
            type: Directory
      nodeSelector:
        {{- with (.Values.global.nodeSelector | default .Values.nodeSelector) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with (.Values.global.affinity | default .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.global.tolerations | default .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
