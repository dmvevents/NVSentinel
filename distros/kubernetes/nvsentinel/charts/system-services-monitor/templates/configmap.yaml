apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "system-services-monitor.fullname" . }}
  labels:
    {{- include "system-services-monitor.labels" . | nindent 4 }}
data:
  CHECK_INTERVAL: {{ .Values.checkInterval | quote }}
  METRICS_PORT: {{ .Values.metricsPort | quote }}
  BOOT_GRACE_PERIOD: {{ .Values.bootGracePeriod | quote }}
  FLAP_WINDOW: {{ .Values.flapWindow | quote }}
  FLAP_THRESHOLD: {{ .Values.flapThreshold | quote }}
  ENABLE_FABRIC_CHECK: {{ .Values.enableFabricCheck | quote }}
  ENABLE_CUDA_VALIDATION: {{ .Values.enableCudaValidation | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
